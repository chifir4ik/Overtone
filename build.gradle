plugins {
    id 'net.fabricmc.fabric-loom'       version "${loom_version}"   apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"   apply false
    id 'net.neoforged.moddev'           version "${moddev_version}" apply false
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Собирает все версии для всех загрузчиков; jar-файлы попадают в dist/'
    dependsOn subprojects.collect { ":${it.name}:build" }
}

tasks.register('cleanDist', Delete) {
    delete layout.projectDirectory.dir('dist')
}
