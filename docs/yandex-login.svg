<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" font-family="Segoe UI,Arial,sans-serif"><rect width="900" height="220" rx="14" fill="#101117"/><text x="20" y="30" fill="#FC3F6B" font-size="18" font-weight="700">Yandex Music login — 4 steps / Вход в Яндекс Музыку — 4 шага</text><g transform="translate(20,50)"><rect width="200" height="150" rx="10" fill="#1c1d27" stroke="#FC3F6B" stroke-opacity=".5"/><circle cx="24" cy="26" r="13" fill="#FC3F6B"/><text x="24" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="46" y="31" fill="#fff" font-size="14" font-weight="600">Click button 1</text><rect x="16" y="70" width="168" height="28" rx="6" fill="#FC3F6B"/><text x="100" y="89" text-anchor="middle" fill="#fff" font-size="11">1. Open the Yandex login page</text><text x="16" y="125" fill="#b4b4c0" font-size="11">Нажмите кнопку 1 в плеере</text></g><g transform="translate(240,50)"><rect width="200" height="150" rx="10" fill="#1c1d27" stroke="#FC3F6B" stroke-opacity=".5"/><circle cx="24" cy="26" r="13" fill="#FC3F6B"/><text x="24" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="46" y="31" fill="#fff" font-size="14" font-weight="600">Log in, allow</text><rect x="16" y="62" width="168" height="46" rx="6" fill="#0b0c10"/><text x="100" y="90" text-anchor="middle" fill="#b4b4c0" font-size="12">Yandex ID → Allow</text><text x="16" y="128" fill="#b4b4c0" font-size="11">Войдите и разрешите доступ</text></g><g transform="translate(460,50)"><rect width="200" height="150" rx="10" fill="#1c1d27" stroke="#FC3F6B" stroke-opacity=".5"/><circle cx="24" cy="26" r="13" fill="#FC3F6B"/><text x="24" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text><text x="46" y="31" fill="#fff" font-size="14" font-weight="600">Copy the address</text><rect x="12" y="64" width="176" height="22" rx="11" fill="#0b0c10"/><rect x="15" y="67" width="170" height="16" rx="8" fill="#FC3F6B" fill-opacity=".35"/><text x="100" y="79" text-anchor="middle" fill="#fff" font-size="9">…#access_token=y0_AgA…</text><text x="16" y="112" fill="#b4b4c0" font-size="11">Ctrl+A, затем Ctrl+C в адресной строке</text></g><g transform="translate(680,50)"><rect width="200" height="150" rx="10" fill="#1c1d27" stroke="#FC3F6B" stroke-opacity=".5"/><circle cx="24" cy="26" r="13" fill="#FC3F6B"/><text x="24" y="31" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4</text><text x="46" y="31" fill="#fff" font-size="14" font-weight="600">Paste, confirm</text><rect x="16" y="62" width="168" height="22" rx="5" fill="#0b0c10"/><text x="24" y="77" fill="#6e6e7c" font-size="10">…access_token=…  (Ctrl+V)</text><rect x="16" y="92" width="168" height="24" rx="6" fill="#FC3F6B"/><text x="100" y="108" text-anchor="middle" fill="#fff" font-size="11">2. Confirm / Подтвердить</text></g></svg>