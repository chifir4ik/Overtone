<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" font-family="Segoe UI,Arial,sans-serif"><rect width="900" height="170" rx="14" fill="#101117"/><text x="20" y="30" fill="#FC3F6B" font-size="18" font-weight="700">Default keys — fit 60% / 65% / 70% keyboards</text><rect x="20" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="40" y="66" text-anchor="middle" fill="#fff" font-size="12">M</text><text x="20" y="95" fill="#b4b4c0" font-size="12">Open player</text><rect x="160" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="180" y="66" text-anchor="middle" fill="#fff" font-size="12">—</text><text x="160" y="95" fill="#b4b4c0" font-size="12">Show/hide HUD (not bound)</text><rect x="300" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="320" y="66" text-anchor="middle" fill="#fff" font-size="12">K</text><text x="300" y="95" fill="#b4b4c0" font-size="12">Settings</text><rect x="440" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="460" y="66" text-anchor="middle" fill="#fff" font-size="12">[</text><text x="440" y="95" fill="#b4b4c0" font-size="12">Previous track</text><rect x="580" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="600" y="66" text-anchor="middle" fill="#fff" font-size="12">]</text><text x="580" y="95" fill="#b4b4c0" font-size="12">Next track</text><rect x="720" y="50" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="740" y="66" text-anchor="middle" fill="#fff" font-size="12">;</text><text x="720" y="95" fill="#b4b4c0" font-size="12">Pause / play</text><rect x="20" y="110" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="40" y="126" text-anchor="middle" fill="#fff" font-size="12">=</text><text x="20" y="155" fill="#b4b4c0" font-size="12">Volume up</text><rect x="160" y="110" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="180" y="126" text-anchor="middle" fill="#fff" font-size="12">-</text><text x="160" y="155" fill="#b4b4c0" font-size="12">Volume down</text><rect x="300" y="110" width="40" height="24" rx="5" fill="#2c2d39" stroke="#FC3F6B"/><text x="320" y="126" text-anchor="middle" fill="#fff" font-size="12">J</text><text x="300" y="155" fill="#b4b4c0" font-size="12">Flying lyrics on/off</text></svg>